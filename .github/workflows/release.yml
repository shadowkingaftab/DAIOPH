name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate release notes
        id: release-notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Build Python package
        run: |
          python -m pip install --upgrade pip build
          python -m build || echo "Package build skipped (no setup.py/pyproject.toml)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## 🚀 DAIOPH Release ${{ github.ref_name }}

            ### ✨ New Features
            - See CHANGELOG.md for details

            ### 🐛 Bug Fixes
            - See CHANGELOG.md for details

            ### 📦 Artifacts
            - Docker image: `daiph/daiph:${{ github.ref_name }}`
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true

      - name: Notify on Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: "🚀 DAIOPH ${{ steps.release-notes.outputs.version }} released!"
          SLACK_MESSAGE: "Release ${{ steps.release-notes.outputs.version }} is live. Check the release notes for details."
        continue-on-error: true