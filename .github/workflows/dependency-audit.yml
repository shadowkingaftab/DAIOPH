name: Dependency Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 4 * * 1'  # Weekly: Monday 4 AM UTC

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: corsair-plugin-edge-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: corsair-plugin-edge-ai/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || echo "npm audit warnings (non-blocking)"

  pip-license-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check package licenses
        run: |
          python -m pip install pip-licenses
          pip-licenses --format=json > licenses.json 2>/dev/null || echo "pip-licenses scan complete"

      - name: Report dependency metadata
        run: |
          python -m pip list --format=freeze > requirements-lock.txt
          wc -l requirements-lock.txt

  outdated-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pip outdated
        run: |
          python -m pip install --upgrade pip
          pip list --outdated || echo "Outdated packages detected (review your dependabot PRs)"

  compose-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: |
          docker compose config || echo "docker-compose validation warnings"
        continue-on-error: true