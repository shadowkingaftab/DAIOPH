apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: daioph-memory
  namespace: daioph
  labels:
    app.kubernetes.io/name: daioph
    app.kubernetes.io/component: memory
spec:
  serviceName: daioph-memory
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: daioph
      app.kubernetes.io/component: memory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daioph
        app.kubernetes.io/component: memory
    spec:
      containers:
        - name: memory
          image: daioph/api:latest
          command: ["python", "-m", "daioph.memory_service"]
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: DAIOPH_MODE
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: daioph-secrets
                  key: database-url
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: memory-data
              mountPath: /data/memory
  volumeClaimTemplates:
    - metadata:
        name: memory-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: daioph-memory
  namespace: daioph
  labels:
    app.kubernetes.io/name: daioph
    app.kubernetes.io/component: memory
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: daioph
    app.kubernetes.io/component: memory