apiVersion: apps/v1
kind: Deployment
metadata:
  name: daioph-worker
  namespace: daioph
  labels:
    app.kubernetes.io/name: daioph
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: daioph
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daioph
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: daioph/api:latest
          command: ["python", "-m", "daioph.worker"]
          env:
            - name: DAIOPH_MODE
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: daioph-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: daioph-secrets
                  key: redis-url
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 10
            periodSeconds: 30