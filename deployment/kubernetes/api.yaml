apiVersion: apps/v1
kind: Deployment
metadata:
  name: daioph-api
  namespace: daioph
  labels:
    app.kubernetes.io/name: daioph
    app.kubernetes.io/component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: daioph
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daioph
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: daioph/api:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DAIOPH_MODE
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: daioph-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: daioph-secrets
                  key: redis-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: daioph-api
  namespace: daioph
  labels:
    app.kubernetes.io/name: daioph
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: daioph
    app.kubernetes.io/component: api