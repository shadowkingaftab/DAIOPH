apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "daioph.fullname" . }}-config
  labels:
    {{- include "daioph.labels" . | nindent 4 }}
data:
  DAIOPH_MODE: {{ .Values.config.mode | quote }}
  DAIOPH_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  DAIOPH_DATABASE_URL: {{ .Values.config.database.url | quote }}
  DAIOPH_REDIS_URL: {{ .Values.config.redis.url | quote }}