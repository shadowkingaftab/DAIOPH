# DAIOPH Testing Models Configuration
models:
  qwen:
    enabled: true
    provider: local
    model_name: Qwen/Qwen2.5-0.5B-Instruct
    device: cpu
    quantization: none
    max_tokens: 128
    temperature: 0.1

  llama:
    enabled: false
    provider: local
    model_name: meta-llama/Llama-3.2-1B-Instruct
    device: cpu
    quantization: int8

  whisper:
    enabled: false
    provider: local
    model_name: openai/whisper-tiny
    device: cpu

  vision:
    enabled: false
    provider: local
    model_name: google/siglip-base-patch16-224
    device: cpu

remote:
  grok:
    enabled: false
    api_key_env: GROK_API_KEY
    base_url: https://api.x.ai/v1

  openai:
    enabled: false
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1

routing:
  strategy: local_first
  fallback_to_remote: false
  timeout_seconds: 10