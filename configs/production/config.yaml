# DAIOPH Production Configuration
mode: production
debug: false
log_level: info

server:
  host: 0.0.0.0
  port: 8000
  workers: 4
  reload: false

database:
  url: ${DATABASE_URL}
  echo: false
  pool_size: 20
  max_overflow: 10

redis:
  url: ${REDIS_URL}
  enabled: true

memory:
  short_term:
    max_size: 10000
    ttl: 86400
  episodic:
    enabled: true
    storage_path: /data/episodic
  semantic:
    enabled: true
    storage_path: /data/semantic

models:
  default_provider: local
  cache_dir: /data/models
  auto_download: true

security:
  encryption_enabled: true
  sandbox_enabled: true
  rate_limit:
    enabled: true
    requests_per_minute: 100

features:
  federated_learning: true
  multimodal: true
  hardware_adaptation: true

observability:
  metrics_enabled: true
  tracing_enabled: true
  metrics_port: 9090